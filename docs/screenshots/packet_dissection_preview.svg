<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="480" fill="url(#codeBg)"/>
  
  <!-- Terminal Header -->
  <rect width="1100" height="42" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#eab308"/>
  <circle cx="56" cy="21" r="5" fill="#22c55e"/>
  <text x="550" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">🔬 Laboratorio Interactivo: Desensamblado Forense del Cebo (OpenXML &amp; OpenAction)</text>

  <!-- Left: Dissected OpenXML Word Template -->
  <g transform="translate(30, 65)">
    <rect width="500" height="385" rx="8" fill="#030712" stroke="#1e293b"/>
    <rect width="500" height="34" rx="8" fill="#0f172a"/>
    <text x="16" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">📄 word/_rels/settings.xml.rels (Inyección Silenciosa)</text>

    <!-- Code content -->
    <g font-family="'JetBrains Mono', monospace" font-size="10.5" transform="translate(16, 52)">
      <text y="0" fill="#64748b">&lt;?xml version="1.0" encoding="UTF-8" standalone="yes"?&gt;</text>
      <text y="20" fill="#64748b">&lt;Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"&gt;</text>
      
      <!-- Highlighted relationship -->
      <rect x="-6" y="32" width="480" height="70" rx="4" fill="#3f121d" stroke="#f43f5e" stroke-width="1"/>
      <text y="48" fill="#fda4af" font-weight="bold">  &lt;Relationship</text>
      <text y="66" fill="#fda4af">    Id="rId1"</text>
      <text y="84" fill="#fb7185">    Type=".../attachedTemplate"</text>
      <text y="102" fill="#f43f5e" font-weight="bold">    Target="https://tu-radar.com/api/t/tk_89ab"&gt;</text>
      <text y="122" fill="#fda4af">    TargetMode="External" /&gt;</text>

      <text y="146" fill="#64748b">&lt;/Relationships&gt;</text>

      <!-- Explanation Box -->
      <rect x="-6" y="170" width="480" height="145" rx="6" fill="#0b1329" stroke="#1d4ed8"/>
      <text y="190" fill="#60a5fa" font-weight="bold">💡 ¿Por qué funciona sin macros?</text>
      <text y="210" fill="#93c5fd">• Microsoft Word consulta la plantilla remota al abrirse.</text>
      <text y="230" fill="#93c5fd">• No activa el bloqueo de macros de Office ni Protected View.</text>
      <text y="250" fill="#93c5fd">• El servidor devuelve 200 OK + GIF transparente 1x1.</text>
      <text y="270" fill="#93c5fd">• Se extrae: IP Pública, ISP, User-Agent, hora y geolocalización.</text>
      <text y="295" fill="#34d399" font-weight="bold">✓ Tiempo medio de alerta al administrador: &lt; 100 ms.</text>
    </g>
  </g>

  <!-- Right: HTTP Beacon Log & Forensics -->
  <g transform="translate(560, 65)">
    <rect width="500" height="385" rx="8" fill="#030712" stroke="#1e293b"/>
    <rect width="500" height="34" rx="8" fill="#0f172a"/>
    <text x="16" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">📡 Telemetría HTTP Inyectada en el Servidor Ingesta</text>

    <!-- Code content -->
    <g font-family="'JetBrains Mono', monospace" font-size="10.5" transform="translate(16, 52)">
      <text y="0" fill="#38bdf8">GET /api/pixel/tk_wrd_89ab.png HTTP/1.1</text>
      <text y="18" fill="#94a3b8">Host: honeytoken.unfantasmaenelsistema.com</text>
      <text y="36" fill="#94a3b8">User-Agent: Mozilla/5.0 (Windows NT 10.0; Microsoft Office Word)</text>
      <text y="54" fill="#94a3b8">Accept: */*</text>
      <text y="72" fill="#94a3b8">X-Forwarded-For: 185.220.101.45</text>
      
      <!-- Server Response -->
      <line x1="-6" y1="90" x2="475" y2="90" stroke="#1e293b"/>
      <text y="108" fill="#34d399">HTTP/1.1 200 OK</text>
      <text y="126" fill="#94a3b8">Content-Type: image/png</text>
      <text y="144" fill="#94a3b8">Cache-Control: no-cache, no-store, must-revalidate</text>
      <text y="162" fill="#94a3b8">Content-Length: 68 bytes</text>

      <!-- Action Box -->
      <rect x="-6" y="185" width="480" height="130" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
      <text y="205" fill="#a5b4fc" font-weight="bold">🚨 Acciones Inmediatas Disparadas:</text>
      <text y="225" fill="#c7d2fe">1. SSE Broadcast instantáneo a todos los operadores SOC.</text>
      <text y="243" fill="#c7d2fe">2. Notificación Web Push nativa al SO de los analistas.</text>
      <text y="261" fill="#c7d2fe">3. Envío de Email con resumen forense y cabeceras completas.</text>
      <text y="280" fill="#c7d2fe">4. Registro en el Informe Forense PDF para auditoría ISO 27001.</text>
      <text y="300" fill="#818cf8" font-weight="bold">🛡️ Clasificación MITRE: T1071.001 (Web Protocols / C2 Beacon)</text>
    </g>
  </g>
</svg>
